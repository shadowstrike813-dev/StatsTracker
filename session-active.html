<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sesiune activă — Health Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="nav.css" />
<link rel="stylesheet" href="style.css" />
<style>
  /* ─── Session header ─── */
  .session-status-bar {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:1rem 1.25rem;
    margin-bottom:1.5rem; display:flex; align-items:center;
    justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .session-timer {
    font-size:28px; font-weight:600; font-family:'DM Mono',monospace;
    color:var(--amber); letter-spacing:0.05em;
  }
  .session-timer.running { color:var(--green); }

  .session-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn-start {
    display:flex; align-items:center; gap:6px;
    background:var(--green); color:#000; border:none;
    border-radius:var(--radius); padding:9px 18px;
    font-family:'Syne',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; transition:opacity 0.15s;
  }
  .btn-start:hover { opacity:0.85; }
  .btn-stop {
    display:flex; align-items:center; gap:6px;
    background:var(--red); color:#fff; border:none;
    border-radius:var(--radius); padding:9px 18px;
    font-family:'Syne',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; transition:opacity 0.15s;
  }
  .btn-stop:hover { opacity:0.85; }

  /* ─── Notification timer ─── */
  .notif-row {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .notif-input {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:var(--radius); color:var(--text);
    font-family:'DM Mono',monospace; font-size:13px;
    padding:7px 10px; width:90px; transition:border-color 0.15s;
  }
  .notif-input:focus { outline:none; border-color:var(--border2); }
  .btn-notif {
    display:flex; align-items:center; gap:5px;
    background:var(--surface3); border:1px solid var(--border2);
    border-radius:var(--radius); padding:7px 12px;
    font-family:'DM Mono',monospace; font-size:12px; color:var(--text-muted);
    cursor:pointer; transition:background 0.15s, color 0.15s;
  }
  .btn-notif:hover { background:var(--surface2); color:var(--text); }
  .notif-status { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .notif-status.active { color:var(--amber); }

  /* ─── Exercise list ─── */
  .active-ex-list { display:flex; flex-direction:column; gap:6px; }

  .active-ex-item {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .active-ex-item.dragging  { opacity:0.3; border-style:dashed; }
  .active-ex-item.drag-over { border-color:var(--blue); }
  .active-ex-item.has-sets  { border-color:rgba(167,139,250,0.3); }

  .active-ex-head {
    display:grid; grid-template-columns:28px 1fr auto auto;
    align-items:center; gap:10px; padding:12px 14px;
    cursor:pointer;
  }
  .active-ex-head:hover { background:var(--surface2); }
  .ex-drag-handle { color:var(--text-dim); font-size:16px; cursor:grab; display:flex; align-items:center; }
  .ex-drag-handle:active { cursor:grabbing; }
  .active-ex-name  { font-size:14px; font-weight:500; }
  .active-ex-group { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .active-ex-sets-count { font-size:12px; font-family:'DM Mono',monospace; color:#a78bfa; }

  /* ─── Sets modal ─── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:500; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius-lg); padding:1.5rem; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; }
  .modal-title { font-size:15px; font-weight:600; margin-bottom:4px; }
  .modal-meta  { font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace; margin-bottom:1.25rem; }

  /* ─── Sets builder (same as exercise.html) ─── */
  .sets-builder { margin-bottom:12px; }
  .set-row { display:grid; grid-template-columns:28px 1fr 1fr 28px 28px; gap:8px; align-items:center; margin-bottom:6px; }
  .set-row.set-warmup { opacity:0.65; }
  .set-row.set-warmup input { border-color:rgba(251,191,36,0.3); }
  .set-num { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; text-align:center; }
  .set-row input {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:var(--radius); color:var(--text);
    font-family:'DM Mono',monospace; font-size:13px;
    padding:7px 10px; width:100%; transition:border-color 0.15s;
  }
  .set-row input:focus { outline:none; border-color:var(--border2); background:var(--surface3); }
  .set-row input::placeholder { color:var(--text-dim); }
  .btn-remove-set { background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:15px; padding:4px; border-radius:6px; transition:color 0.15s; line-height:1; }
  .btn-remove-set:hover { color:var(--red); }
  .btn-warmup-toggle { background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:14px; padding:4px; border-radius:6px; transition:color 0.15s; line-height:1; }
  .btn-warmup-toggle:hover { color:var(--amber); }
  .btn-warmup-toggle.active { color:var(--amber); }

  .btn-add-set { display:flex; align-items:center; gap:5px; background:none; border:1px dashed var(--border2); border-radius:var(--radius); padding:6px 12px; font-family:'DM Mono',monospace; font-size:12px; color:var(--text-muted); cursor:pointer; transition:border-color 0.15s, color 0.15s; margin-bottom:12px; }
  .btn-add-set:hover { border-color:var(--blue); color:var(--blue); }

  .modal-form-field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .modal-form-field label { font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; }
  .modal-form-field input { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-family:'DM Mono',monospace; font-size:13px; padding:7px 10px; }
  .modal-form-field input:focus { outline:none; border-color:var(--border2); }

  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:1rem; }
  .btn-cancel { background:none; border:1px solid var(--border2); border-radius:var(--radius); padding:8px 16px; color:var(--text-muted); font-family:'Syne',sans-serif; font-size:13px; cursor:pointer; }
  .btn-cancel:hover { background:var(--surface2); }
  .btn-save-sets { background:#a78bfa; color:#000; border:none; border-radius:var(--radius); padding:8px 20px; font-family:'Syne',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:opacity 0.15s; }
  .btn-save-sets:hover { opacity:0.85; }
  .err-msg { font-size:12px; color:var(--red); font-family:'DM Mono',monospace; min-height:16px; margin-top:4px; }

  /* ─── Charts popup ─── */
  .charts-popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:600; overflow-y:auto; padding:1rem; }
  .charts-popup-overlay.open { display:block; }
  .charts-popup { max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .charts-popup-header { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
  .charts-popup-title { font-size:16px; font-weight:600; }
  .btn-close-charts { background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:20px; padding:6px; border-radius:var(--radius); }
  .btn-close-charts:hover { color:var(--text); }
  .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; }
  .chart-card-title { font-size:13px; font-weight:600; margin-bottom:4px; }
  .chart-card-meta  { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; margin-bottom:12px; }
  .chart-card-wrap  { position:relative; height:160px; }

  .btn-charts {
    display:flex; align-items:center; gap:6px;
    background:var(--surface3); border:1px solid var(--border2);
    border-radius:var(--radius); padding:8px 14px;
    font-family:'DM Mono',monospace; font-size:12px; color:var(--text-muted);
    cursor:pointer; transition:background 0.15s, color 0.15s;
  }
  .btn-charts:hover { background:var(--surface2); color:var(--text); }
</style>
<link rel="manifest" href="manifest.json" />
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');</script>
</head>
<body>
<div class="app">
  <main class="main">
    <header>
      <h1 id="session-title">Sesiune activă</h1>
      <p id="session-subtitle">—</p>
    </header>

    <!-- Status bar -->
    <div class="session-status-bar">
      <div>
        <div style="font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px;">Timp scurs</div>
        <div class="session-timer" id="session-timer">00:00</div>
      </div>
      <div class="session-controls">
        <div class="notif-row">
          <input type="number" class="notif-input" id="notif-minutes" placeholder="min" min="1" max="999" title="Notificare după X minute" />
          <button class="btn-notif" id="btn-set-notif"><i class="ti ti-bell"></i> Setează</button>
          <span class="notif-status" id="notif-status"></span>
        </div>
        <button class="btn-charts" id="btn-show-charts"><i class="ti ti-chart-line"></i> Grafice</button>
        <button class="btn-start" id="btn-start-session" style="display:none"><i class="ti ti-player-play"></i> Start</button>
        <button class="btn-stop"  id="btn-stop-session"  style="display:none"><i class="ti ti-player-stop"></i> Finalizează</button>
      </div>
    </div>

    <!-- Exercise list -->
    <div class="active-ex-list" id="active-ex-list"></div>
  </main>
</div>

<!-- Sets modal -->
<div class="modal-overlay" id="sets-modal">
  <div class="modal">
    <div class="modal-title" id="sets-modal-title">—</div>
    <div class="modal-meta"  id="sets-modal-meta">—</div>
    <div class="sets-builder" id="modal-sets-builder"></div>
    <button class="btn-add-set" id="modal-btn-add-set"><i class="ti ti-plus"></i> Serie nouă</button>
    <div class="modal-form-field">
      <label>Note (opțional)</label>
      <input type="text" id="modal-notes" placeholder="ex: obosit, formă bună…" />
    </div>
    <div class="err-msg" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-btn-cancel">Anulează</button>
      <button class="btn-save-sets" id="modal-btn-save">Salvează seriile</button>
    </div>
  </div>
</div>

<!-- Charts popup -->
<div class="charts-popup-overlay" id="charts-popup">
  <div class="charts-popup">
    <div class="charts-popup-header">
      <div class="charts-popup-title">Grafice sesiune</div>
      <button class="btn-close-charts" id="btn-close-charts"><i class="ti ti-x"></i></button>
    </div>
    <div id="charts-popup-content"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="db.js"></script>
<script src="nav.js"></script>
<script src="session-active.js"></script>
</body>
</html>
