<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="nav.css" />
<style>
  header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  header p { font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 1.5rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.25rem;
    text-decoration: none; color: var(--text); display: block;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { background: var(--surface2); border-color: var(--border2); }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }

  .card-icon { width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .card-icon.blue  { background: var(--blue-dim);  color: var(--blue); }
  .card-icon.green { background: var(--green-dim); color: var(--green); }

  .card-badge { font-size: 11px; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
  .badge-ok   { background: var(--green-dim); color: var(--green); }
  .badge-none { background: var(--surface3);  color: var(--text-dim); }
  .badge-dot  { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .card-title { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .card-value { font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .card-value.blue  { color: var(--blue); }
  .card-value.green { color: var(--green); }
  .card-sub { font-size: 12px; color: var(--text-dim); font-family: 'DM Mono', monospace; }

  .card-trend { display: flex; align-items: center; gap: 5px; font-size: 12px; font-family: 'DM Mono', monospace; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .trend-up      { color: var(--red); }
  .trend-down    { color: var(--green); }
  .trend-neutral { color: var(--text-muted); }

  .section-sep { display: flex; align-items: center; gap: 12px; margin: 1.5rem 0 1.25rem; }
  .section-sep hr { flex: 1; border: none; border-top: 1px solid var(--border); }
  .section-sep span { font-size: 11px; color: var(--text-dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }

  .ex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

  .ex-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 0.9rem 1rem;
    text-decoration: none; color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    display: flex; flex-direction: column; gap: 5px;
    min-height: 110px;
  }
  .ex-card:hover { background: var(--surface2); border-color: var(--border2); }

  .ex-card-group { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
  .ex-card-name  { font-size: 13px; font-weight: 600; line-height: 1.3; flex: 1; }
  .ex-card-max   { font-size: 16px; font-weight: 600; color: #a78bfa; }
  .ex-card-date  { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; }

  .ex-grid-empty { font-size: 13px; color: var(--text-dim); font-family: 'DM Mono', monospace; padding: 0.5rem 0; grid-column: span 5; }

  @media (max-width: 768px) {
    header { margin-bottom: 1.25rem; padding-bottom: 1rem; }
    header h1 { font-size: 18px; }
    .cards { grid-template-columns: 1fr; gap: 10px; }
    .card-value { font-size: 22px; }
    .ex-grid { grid-template-columns: repeat(2, 1fr); }
    .ex-grid-empty { grid-column: span 2; }
    .ex-card { min-height: 90px; }
  }
</style>

<link rel="manifest" href="manifest.json" />
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }
</script>
</head>
<body>
<div class="app">
  <main class="main">
    <header>
      <h1 id="greeting">Bună ziua</h1>
      <p>Iată un sumar al datelor tale</p>
    </header>

    <div class="cards">
      <a class="card" href="blood-pressure.html">
        <div class="card-head">
          <div class="card-icon blue"><i class="ti ti-activity"></i></div>
          <span class="card-badge badge-none" id="bp-badge"><span class="badge-dot"></span>—</span>
        </div>
        <div class="card-title">Tensiune arterială</div>
        <div class="card-value blue" id="bp-value">—</div>
        <div class="card-sub" id="bp-sub">nicio măsurătoare</div>
        <div class="card-trend" id="bp-trend"><i class="ti ti-minus trend-neutral"></i><span class="trend-neutral">fără date</span></div>
      </a>

      <a class="card" href="weight.html">
        <div class="card-head">
          <div class="card-icon green"><i class="ti ti-weight"></i></div>
          <span class="card-badge badge-none" id="w-badge"><span class="badge-dot"></span>—</span>
        </div>
        <div class="card-title">Greutate</div>
        <div class="card-value green" id="w-value">—</div>
        <div class="card-sub" id="w-sub">nicio măsurătoare</div>
        <div class="card-trend" id="w-trend"><i class="ti ti-minus trend-neutral"></i><span class="trend-neutral">fără date</span></div>
      </a>
    </div>

    <div class="section-sep">
      <hr /><span>Antrenament</span><hr />
    </div>

    <div class="ex-grid" id="ex-grid">
      <p class="ex-grid-empty">Se încarcă…</p>
    </div>
  </main>
</div>

<script src="db.js"></script>
<script src="nav.js"></script>
<script>
initNav('home');

function fmtDate(d) { const [y,m,day] = d.split('-'); return `${day}.${m}.${y}`; }
function todayIso() { return new Date().toISOString().split('T')[0]; }
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Bună dimineața' : h < 18 ? 'Bună ziua' : 'Bună seara';
}
function trendHtml(last, avg, unit) {
  if (last === null || avg === null) return `<i class="ti ti-minus trend-neutral"></i><span class="trend-neutral">fără date suficiente</span>`;
  const diff = Math.round((last - avg) * 10) / 10;
  if (Math.abs(diff) < 0.5) return `<i class="ti ti-minus trend-neutral"></i><span class="trend-neutral">la medie (${avg}${unit})</span>`;
  if (diff > 0) return `<i class="ti ti-trending-up trend-up"></i><span class="trend-up">+${diff}${unit} față de medie</span>`;
  return `<i class="ti ti-trending-down trend-down"></i><span class="trend-down">${diff}${unit} față de medie</span>`;
}

async function loadBloodPressure() {
  try {
    const data = await DB.getEntries();
    if (!data.length) return;
    const sorted = data.sort((a,b) => b.date.localeCompare(a.date));
    const last = sorted[0], avg = Math.round(data.reduce((s,e) => s+e.sys,0)/data.length);
    document.getElementById('bp-value').textContent = `${last.sys}/${last.dia}`;
    document.getElementById('bp-sub').textContent = `ultima: ${fmtDate(last.date)}`;
    const badge = document.getElementById('bp-badge');
    const today = last.date === todayIso();
    badge.className = `card-badge ${today ? 'badge-ok' : 'badge-none'}`;
    badge.innerHTML = `<span class="badge-dot"></span>${today ? 'azi' : 'nu azi'}`;
    document.getElementById('bp-trend').innerHTML = trendHtml(last.sys, avg, ' mmHg');
  } catch(e) {}
}

async function loadWeight() {
  try {
    const data = await DB.getWeight();
    if (!data.length) return;
    const sorted = data.sort((a,b) => b.date.localeCompare(a.date));
    const last = sorted[0], avg = Math.round((data.reduce((s,e) => s+e.kg,0)/data.length)*10)/10;
    document.getElementById('w-value').textContent = `${last.kg} kg`;
    document.getElementById('w-sub').textContent = `ultima: ${fmtDate(last.date)}`;
    const badge = document.getElementById('w-badge');
    const today = last.date === todayIso();
    badge.className = `card-badge ${today ? 'badge-ok' : 'badge-none'}`;
    badge.innerHTML = `<span class="badge-dot"></span>${today ? 'azi' : 'nu azi'}`;
    document.getElementById('w-trend').innerHTML = trendHtml(last.kg, avg, ' kg');
  } catch(e) {}
}

async function loadExercises() {
  const grid = document.getElementById('ex-grid');
  try {
    const [exercises, workouts] = await Promise.all([DB.getExercises(), DB.getWorkouts()]);

    const active = exercises.filter(e => e.active).sort((a,b) => a.order - b.order);
    if (!active.length) {
      grid.innerHTML = `<p class="ex-grid-empty">Niciun exercițiu configurat. <a href="configure-exercises.html" style="color:var(--blue)">Adaugă exerciții →</a></p>`;
      return;
    }

    const byEx = {};
    workouts.forEach(w => { if (!byEx[w.exercise_id]) byEx[w.exercise_id] = []; byEx[w.exercise_id].push(w); });

    const withMeta = active.map(ex => {
      const wks = (byEx[ex.id] || []).sort((a,b) => b.date.localeCompare(a.date));
      const last = wks[0] || null;
      const lastMax = last ? Math.max(...last.sets.map(s => s.kg)) : -1;
      return { ex, last, lastMax };
    });

    withMeta.sort((a,b) => {
      const da = a.last ? a.last.date : '0000-00-00';
      const db = b.last ? b.last.date : '0000-00-00';
      return db.localeCompare(da);
    });

    grid.innerHTML = withMeta.slice(0,15).map(({ex, last, lastMax}) => `
      <a class="ex-card" href="exercise.html?id=${ex.id}">
        <div class="ex-card-group">${ex.muscle_group || '—'}</div>
        <div class="ex-card-name">${ex.name}</div>
        <div class="ex-card-max">${last ? lastMax + ' kg' : '—'}</div>
        <div class="ex-card-date">${last ? fmtDate(last.date) : 'nicio sesiune'}</div>
      </a>
    `).join('');
  } catch(e) {
    grid.innerHTML = '<p class="ex-grid-empty">Eroare la încărcare.</p>';
  }
}

async function loadProfile() {
  try {
    const p = await DB.getProfile();
    document.getElementById('greeting').textContent = p.name ? `${greeting()}, ${p.name}` : greeting();
  } catch(e) { document.getElementById('greeting').textContent = greeting(); }
}

loadProfile(); loadBloodPressure(); loadWeight(); loadExercises();
</script>
<script>
  // La home, adaugam o intrare goala in history ca back sa iasa din app
  if (history.state === null) {
    history.pushState({ page: 'home' }, '', location.href);
  }
</script>
</body>
</html>
